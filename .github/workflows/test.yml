name: Test

# Validates the theme on pull requests and on pushes to any branch but main,
# where the deploy workflow already runs gscan before shipping.

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  gscan:
    name: gscan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fail on any gscan error or warning
        run: npx gscan --fatal --verbose .

      - name: Check the built assets are committed and up to date
        run: |
          if [ -n "$(git status --porcelain assets/built)" ]; then
            echo "assets/built is out of date — run 'npm run build' and commit the result."
            git --no-pager diff --stat assets/built
            exit 1
          fi
